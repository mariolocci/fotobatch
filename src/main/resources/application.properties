spring.main.web-application-type=servlet
fotobatch.cli.enabled=false
fotobatch.indexing.paths-resource=indexing-paths.txt
fotobatch.location.lookup-range-km=4
server.port=8081

spring.datasource.url=jdbc:h2:file:./target/fotobatch-db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=./target/lucene-index
spring.jpa.properties.hibernate.search.indexing.plan.synchronization.strategy=sync
